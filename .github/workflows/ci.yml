# CI: lint, typecheck, and test frontend and backend in parallel.
# npm ci is used instead of npm install so CI installs exactly what package-lock.json pins.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Lesson persistence is proven against a real PostgreSQL, not a stand-in:
    # the suite builds its schema with `alembic upgrade head` and relies on
    # real foreign keys and CHECK constraints.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: classflow
          POSTGRES_PASSWORD: classflow
          POSTGRES_DB: classflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U classflow -d classflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://classflow:classflow@localhost:5432/classflow_test
      AUTH_SECRET: test-secret-not-for-production-use-32b
      COOKIE_SECURE: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # cache-dependency-path is required: requirements.txt is not at the repo root.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q
