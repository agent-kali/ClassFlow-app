# Render Blueprint. Connect this file from the repository root.
# It creates the FastAPI service and PostgreSQL database. Do not create those
# resources again by hand.
#
# Secrets are not in this file. AUTH_SECRET is generated by Render.
# DATABASE_URL is the private connection string for classflow-db.

services:
  - type: web
    name: classflow-api
    runtime: python
    rootDir: backend
    region: singapore
    plan: 0.5c-512mb
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    initialDeployHook: python -m app.seed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: classflow-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"

databases:
  - name: classflow-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    diskSizeGB: 1
    ipAllowList: []
